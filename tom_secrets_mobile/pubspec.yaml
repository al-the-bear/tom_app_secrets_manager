name: tom_secrets_mobile
description: >-
  The Tom Secrets Manager's mobile app on iOS, iPadOS and Android: the
  composition root over tom_secrets_ui's screens with an adaptive phone and
  tablet shell, and an in-app engine in place of the secrets service, which
  fetches the vaults from GitHub into memory only (part-mobile). License:
  BSD-3-Clause.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # The screens, the session, the OS unlock and the ports this app fills.
  tom_secrets_ui:
    path: ../tom_secrets_ui
  # The vault set and the GitHub opener of the service, run in the app
  # without an offline cache: the vaults are held in memory only. No service
  # runs on a phone (part-mobile).
  tom_secrets_service: ^0.16.0
  tom_secrets_core: ^0.2.13
  tom_secrets_client: ^0.2.11
  tom_core_storage: ^0.1.3
  # The keychain items (key files, repository keys, GitHub tokens) and the
  # gated item of the biometric unlock.
  tom_biometric_storage: ^6.0.0-dev.10+tom.1
  tom_basics: ">=3.3.0"
  tom_crypto: ^1.5.0
  # Not imported: the floor its Android build needs (the getrandom system
  # call through syscall(2), 0.1.2), for the pairing's ML-KEM.
  tom_pqc: ^0.1.2
  http: ^1.2.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  # The camera's QR reader (the desktop's pairing code, TOTP secrets):
  # AVFoundation on iOS, Google's ML Kit model bundled on Android
  # (tsm_b_mobile1, decision (a); THIRD_PARTY.md).
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tom_github_api: ^1.5.0
  tom_kdbx_store: ^0.2.5

flutter:
  uses-material-design: true
