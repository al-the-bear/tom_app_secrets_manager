name: tom_secrets_relay
description: >-
  The Tom Secrets Manager's relay server (part-relay): a tom_core_server
  application carrying pairing rendezvous, approval links and mailboxes of
  age packages between devices, seeing only ciphertext. License: BSD-3-Clause.
publish_to: none
version: 0.3.0
repository: https://github.com/al-the-bear/tom_app_secrets_manager

environment:
  sdk: ^3.10.0

executables:
  tom_secrets_relay: tom_secrets_relay

dependencies:
  # The server: endpoints and WebSocket endpoints, the configuration, the
  # rate limiter, the blob store, the scheduler (with tom_core_kernel).
  tom_core_server: ^1.5.1
  tom_core_kernel: ^1.2.0
  tom_reflection: ^1.0.2
  # The recipient proof: a nonce encrypted to the member's hybrid key. No
  # vault format (the relay imports no KDBX).
  tom_secrets_age: ^0.1.0
  crypto: ^3.0.6
  shelf: ^1.4.2
  path: ^1.9.1

dev_dependencies:
  # The client side (TomSecretsServerRelay), run against this server in the
  # end-to-end test only: the relay itself links no vault format.
  tom_secrets_core: ^0.2.25
  # Two real secrets services pairing their approval link through this
  # relay (the end-to-end test of the link).
  tom_secrets_service: ^0.25.6
  tom_secrets_client: ^0.2.19
  tom_core_storage: ^0.1.2
  lints: ^6.0.0
  test: ^1.25.6
  web_socket_channel: ^3.0.0
  build_runner: ^2.10.4
  tom_reflection_generator: ^1.9.2
