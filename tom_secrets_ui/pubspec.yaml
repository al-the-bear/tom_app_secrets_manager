name: tom_secrets_ui
description: >-
  The screens and state of the Tom Secrets Manager's manager app, shared by
  the desktop and (phase B) the mobile app: the shell, unlock, the vault
  browser and the entry editor, over ports the host implements (the service,
  the tray, the window, notifications, screen capture). License: BSD-3-Clause.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # The controllers handed down the widget tree (part-app, State).
  provider: ^6.1.5
  # The vaults: KDBX through the one gateway (DP-29), the TOTP, the password
  # generator, the stored-file codec and the entry fields.
  tom_secrets_core: ^0.2.3
  # The admin errors and the reference grammar ("How clients name it").
  tom_secrets_client: ^0.2.4
  # The key fields, notices, sync indicator and the masked editing surface.
  tom_ui_support: ^0.1.0
  tom_host_ui: ^0.1.0
  tom_credentials_ui: ^0.1.0
  tom_sync_ui: ^0.1.0
  # The protected clipboard (cleared after a timeout).
  tom_basics: ">=3.3.0"
  # The token prompt's types (the First run wizard's GitHub token).
  tom_core_storage: ^0.1.2
  # The sync states the top bar's indicator presents.
  tom_core_sync: ^0.1.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The demo vaults' light Argon2id (a test opens a vault in milliseconds);
  # a dev dependency is not linked (DP-29 holds for the shipped closure).
  tom_kdbx_store: ^0.2.4
  # The fake GitHub the First run's repository check is tested against.
  tom_github_api: ^1.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
