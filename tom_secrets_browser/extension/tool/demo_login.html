<!doctype html>
<!--
  The demo login page of the extension's screenshots (tool/screenshots.mjs),
  served on 127.0.0.1. Demo data only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Mail — Sign in</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #1d2733; }
  header { background: #1d4f91; color: #fff; padding: 14px 28px; font-size: 18px; font-weight: 600; }
  main { max-width: 380px; margin: 56px auto; background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 22px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: #4a5866; }
  input { width: 100%; box-sizing: border-box; font-size: 15px; padding: 10px 12px; border: 1px solid #c4ccd5; border-radius: 6px; }
  button { margin-top: 22px; width: 100%; font-size: 15px; padding: 11px; border: 0; border-radius: 6px; background: #1d4f91; color: #fff; }
</style>
</head>
<body>
<header>Demo Mail</header>
<main>
  <h1>Sign in</h1>
  <form id="login" method="post" action="/welcome">
    <label for="user">Email or user name</label>
    <input id="user" name="user" type="text" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
