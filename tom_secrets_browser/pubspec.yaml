name: tom_secrets_browser
description: >-
  The Tom Secrets Manager's browser integration (part-browser): the
  native-messaging host tsm-browser-host, which the browsers start for the
  product's extension and which talks to the secrets service over the client
  protocol. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_app_secrets_manager

environment:
  sdk: ^3.10.8

executables:
  tsm-browser-host: tsm_browser_host

dependencies:
  # The client protocol, and the extension ids and distribution layout the
  # host shares with the app's manifests.
  tom_secrets_client: ^0.2.19

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
